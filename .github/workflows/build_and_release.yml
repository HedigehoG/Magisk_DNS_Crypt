name: Build and Release Magisk Module

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get module version from module.prop
        id: get_version
        run: |
          MODULE_VERSION=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r')
          MODULE_ID=$(grep '^id=' module.prop | cut -d'=' -f2 | tr -d '\r')
          echo "MODULE_VERSION=$MODULE_VERSION" >> "$GITHUB_OUTPUT"
          echo "MODULE_ID=$MODULE_ID" >> "$GITHUB_OUTPUT"

      - name: Prepare module directory for packaging
        run: |
          # Устанавливаем dos2unix для фикса окончаний строк
          sudo apt-get update && sudo apt-get install -y dos2unix

          mkdir -p module_package

          # Копируем всё необходимое (включая папку scripts)
          cp module.prop module_package/
          cp customize.sh module_package/
          [ -f action.sh ] && cp action.sh module_package/
          [ -f service.sh ] && cp service.sh module_package/
          [ -f MyDoH_Config.txt ] && cp MyDoH_Config.txt module_package/
          [ -d META-INF ] && cp -r META-INF module_package/
          [ -d scripts ] && cp -r scripts module_package/
          [ -f README.md ] && cp README.md module_package/
          [ -f update.json ] && cp update.json module_package/

          # Приводим все sh и prop к формату unix (LF)
          find module_package -type f \( -name "*.sh" -o -name "*.prop" -o -name "*.txt" \) -exec dos2unix {} +

      - name: Create Magisk module ZIP
        run: |
          ZIP_NAME="${{ steps.get_version.outputs.MODULE_ID }}-${{ steps.get_version.outputs.MODULE_VERSION }}.zip"
          cd module_package
          zip -r9 "../$ZIP_NAME" .
          cd ..
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_OUTPUT"
        id: pack

      - name: Upload module artifact
        uses: actions/upload-artifact@v4
        with:
          name: magisk_dns_crypt
          path: "${{ steps.pack.outputs.ZIP_NAME }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: "v${{ steps.get_version.outputs.MODULE_VERSION }}"
          name: "Release v${{ steps.get_version.outputs.MODULE_VERSION }}"
          draft: false
          prerelease: false
          files: "${{ steps.pack.outputs.ZIP_NAME }}"
          body: |
            Release of Magisk DNS Crypt (v${{ steps.get_version.outputs.MODULE_VERSION }})

            **Included features:**
            * Automatic dnsproxy deployment
            * Local DNS proxy on 127.0.0.1:5353
            * Support for Cloudflare, Google, Comss & Custom DoH

            **Installation:**
            1. Download attached ZIP.
            2. Flash via Magisk Manager / KernelSU / APatch.
            3. Configure `/sdcard/Download/MyDoH_Config.txt` if needed.
